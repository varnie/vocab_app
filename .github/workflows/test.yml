name: Test

on: [push, pull_request]

jobs:
  gtk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb
          /usr/bin/python3 -m venv --system-site-packages .gtk-venv
          .gtk-venv/bin/pip install -r requirements.txt
      - name: Test GTK interactions on an isolated display
        run: xvfb-run -a .gtk-venv/bin/python -m pytest -q src/tests/integration/test_gui.py
        env:
          RUN_GTK_TESTS: '1'
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest -v --cov=src --cov-report=term --cov-report=xml
