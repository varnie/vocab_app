[project]
name = "vocab_app"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "sqlalchemy==2.0.49",
    "deep-translator==1.11.4",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
preview = true
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security issues)
    "RUF",   # Ruff-specific rules
]
[tool.ruff.lint.per-file-ignores]
"src/infrastructure/tray/tray_macos.py" = ["invalid-function-name"]  # ObjC protocol
"src/vocab_gui.py" = ["module-import-not-at-top-of-file"]  # gi.require_version must precede GTK import
"src/windows/*.py" = ["module-import-not-at-top-of-file"]  # gi.require_version must precede GTK import
"src/infrastructure/tray/tray_linux.py" = ["module-import-not-at-top-of-file"]  # gi.require_version must precede GTK import
"src/infrastructure/clipboard.py" = ["suspicious-subprocess-import"]  # subprocess used safely
"src/infrastructure/notifications.py" = ["suspicious-subprocess-import"]  # subprocess used safely
"src/infrastructure/tray/__init__.py" = ["non-empty-init-module"]  # conditional imports needed
"src/repositories/__init__.py" = ["non-empty-init-module"]  # factory registration needed
"src/tests/**/*.py" = [
    "assert",   # assert — standard in pytest
    "hardcoded-temp-file",   # /tmp paths — all mocked in tests
    "multiple-with-statements", # nested with — stylistic, tests prefer readability
    "ambiguous-unicode-character-string", # Cyrillic in test data — intentional
    "float-equality-comparison", # float equality 2.5 — exact init value, not computed
]
"src/application/__init__.py" = ["non-empty-init-module"]  # non-trivial code, not just re-exports
"src/windows/__init__.py" = ["non-empty-init-module"]  # shared GTK helpers by design
